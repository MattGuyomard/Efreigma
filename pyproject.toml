[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efreigma"
version = "1.2.0"
description = "PNG, PCM WAV and lossless video LSB steganography engine"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<13", "streamlit>=1.40,<2", "av>=17,<18"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
